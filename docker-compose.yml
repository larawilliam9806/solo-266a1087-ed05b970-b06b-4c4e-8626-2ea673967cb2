services:
  hll-reporting:
    build: .
    image: hll-reporting:latest
    container_name: hll-reporting
    ports:
      - "8000:8000"
    environment:
      HLL_DB_PATH: /data/hll.sqlite3
    volumes:
      - hll-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  hll-data:
